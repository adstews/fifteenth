<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Fifteenth</title>
    <meta name="description" content="Something new is coming from Fifteenth. Stay tuned.">
    <meta name="robots" content="noindex, nofollow">
    <style>
        @font-face {
            font-family: 'SeasonSans';
            src: url('https://cdn.prod.website-files.com/678ec8f3012c73b4c6e6f5fd/678eca35d8bb6420ea788f27_SeasonSans-Regular.ttf') format('truetype');
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: 'SeasonSans';
            src: url('https://cdn.prod.website-files.com/678ec8f3012c73b4c6e6f5fd/678eca35fef529dc25149ac5_SeasonSans-Medium.ttf') format('truetype');
            font-weight: 500;
            font-display: swap;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #FBFAF8;
            --text: #131313;
            --green: #56E415;
            --muted: #918F89;
            --font: 'SeasonSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
            -webkit-font-smoothing: antialiased;
        }

        .logo {
            height: 24px;
            margin-bottom: 48px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--green);
            margin: 0 auto 24px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        h1 {
            font-size: clamp(36px, 5vw, 56px);
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: -1px;
            margin-bottom: 16px;
        }

        p {
            font-size: 18px;
            font-weight: 400;
            color: var(--muted);
            max-width: 420px;
            line-height: 1.6;
        }

        .footer {
            position: absolute;
            bottom: 32px;
            font-size: 14px;
            color: var(--muted);
        }

        .footer a {
            color: var(--text);
            text-decoration: none;
        }

        .footer a:hover {
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <img src="https://cdn.prod.website-files.com/678ec8f3012c73b4c6e6f5fd/68f77e21b217193c1cf3f127_68656edf3860e601015daebefe47c065_fifteenth-logo.svg" alt="Fifteenth" class="logo">
    <div class="dot"></div>
    <h1>Coming soon.</h1>
    <p>We're setting things up. Check back shortly.</p>
    <div class="footer">
        <a href="mailto:hello@fifteenth.com">hello@fifteenth.com</a>
    </div>
</body>
</html>
